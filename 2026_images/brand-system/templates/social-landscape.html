<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>NeuralSeek · Social landscape 1200×627</title>
<meta name="ns-template" content="social-landscape">
<link rel="stylesheet" href="../tokens/brand.css">
<style>
/* LOCKED LAYOUT. LinkedIn link posts, text-heavy posts, blog and event share images. */
.fmt-landscape{--scrim:linear-gradient(90deg,rgba(var(--s),var(--sa)) 0%,rgba(var(--s),calc(var(--sa)*.75)) 55%,rgba(var(--s),.05) 100%)}
.fmt-landscape .eyebrow{position:absolute;left:64px;top:60px;font-size:18px}
.fmt-landscape .copy{position:absolute;left:64px;top:170px;width:880px}
.fmt-landscape .headline{font-size:70px}
.fmt-landscape .headline[data-size=s]{font-size:60px}
.fmt-landscape .sub{font-size:26px;margin-top:24px;max-width:780px}
.fmt-landscape .logo{position:absolute;left:64px;bottom:56px;width:180px}
.fmt-landscape .meta{position:absolute;right:64px;bottom:62px;font-size:16px}
</style></head>
<body class="ns-doc">
<!-- data-palette: night | dawn | aurora | bloom | ice · data-texture: silk | streak | ribbon. Headline max 3 lines, sub max 2. -->
<div class="frame fmt-landscape" data-palette="dawn" data-texture="silk">
  <div class="eyebrow" data-slot="eyebrow">Blog · Governance</div>
  <div class="copy">
    <h1 class="headline" data-slot="headline" data-max-lines="3">What an examiner asks <span class="kp">about your agents</span></h1>
    <p class="sub" data-slot="sub" data-max-lines="2">Five questions, and the evidence that answers each one.</p>
  </div>
  <div class="logo"></div>
  <div class="meta foot" data-slot="meta">neuralseek.com</div>
</div>
</body></html>
