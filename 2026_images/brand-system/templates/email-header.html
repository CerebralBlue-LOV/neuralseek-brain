<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>NeuralSeek · Email header 1200×400</title>
<meta name="ns-template" content="email-header">
<link rel="stylesheet" href="../tokens/brand.css">
<style>
/* LOCKED LAYOUT. Newsletter and email headers (displayed at 600 px wide). Light only. */
.fmt-email{--scrim:linear-gradient(90deg,rgba(var(--s),.7) 0%,rgba(var(--s),.5) 55%,rgba(var(--s),0) 90%)}
.fmt-email .logo{position:absolute;left:64px;top:56px;width:200px}
.fmt-email .eyebrow{position:absolute;right:64px;top:64px;font-size:18px}
.fmt-email .headline{position:absolute;left:64px;top:170px;width:900px;font-size:66px}
</style></head>
<body class="ns-doc">
<!-- data-palette/data-texture pairs available: dawn silk | dawn ribbon | ice silk. Headline max 2 lines. Put body copy in the email HTML, not in the image. -->
<div class="frame fmt-email" data-palette="dawn" data-texture="silk">
  <div class="logo"></div>
  <div class="eyebrow" data-slot="eyebrow">Newsletter · November</div>
  <h1 class="headline" data-slot="headline" data-max-lines="2">What shipped <span class="kp">this month</span></h1>
</div>
</body></html>
